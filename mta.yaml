_schema-version: "3.1"
ID: expense-management
description: BluestoneX Expense Reimbursement System
version: 1.0.0

# ─────────────────────────────────────────────────────────────────────────────
# BUILD (runs before any module) — generates gen/srv + gen/db from the CAP model
# so the srv/db-deployer module paths resolve on a fresh clone (e.g. BAS).
# ─────────────────────────────────────────────────────────────────────────────
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

# ─────────────────────────────────────────────────────────────────────────────
# MODULES
# ─────────────────────────────────────────────────────────────────────────────
modules:

  # ── CAP Node.js Backend ────────────────────────────────────────────────────
  - name: expense-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    requires:
      - name: expense-management-db
      - name: expense-management-xsuaa
      # SMTP service for approver emails. Optional: if 'expense-mail' isn't
      # created, deploy still succeeds and the mailer safely no-ops.
      # Create it once with:
      #   cf cups expense-mail -p '{"host":"smtp.example.com","port":587,"user":"u","pass":"p","from":"noreply@bluestonex.com","secure":false}'
      - name: expense-management-mail
        parameters:
          optional: true
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── HANA DB Deployer ───────────────────────────────────────────────────────
  - name: expense-management-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: expense-management-db

  # ── HTML5 App Content Deployer ─────────────────────────────────────────────
  - name: expense-management-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: expense-management-html5-host
        parameters:
          content-target: true
    build-parameters:
      # Stage into a fresh 'resources/' folder — NOT 'app/'. 'app/' is the source
      # dir (app/my-expenses, app/approval, .DS_Store), so zipping it produced an
      # invalid html5-apps-repo payload (CODE 1001). resources/ holds only the two
      # app zips, so data.zip contains exactly one zip per HTML5 app at its root.
      build-result: resources/
      requires:
        - name: expense-management-my-expenses
          artifacts: [ my-expenses.zip ]
          target-path: resources/
        - name: expense-management-approval
          artifacts: [ approval.zip ]
          target-path: resources/

  # ── Freestyle App: My Expenses (Employee) ──────────────────────────────────
  - name: expense-management-my-expenses
    type: html5
    path: app/my-expenses
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # ── Freestyle App: Approval (Approver + Admin, 3 tabs) ─────────────────────
  - name: expense-management-approval
    type: html5
    path: app/approval
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

# ─────────────────────────────────────────────────────────────────────────────
# RESOURCES (BTP Service Instances)
# ─────────────────────────────────────────────────────────────────────────────
resources:

  # ── HANA HDI Container ────────────────────────────────────────────────────
  - name: expense-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ── External org-apps HDI container (classic USERS_MASTER) — STAGED ────────
  # Prepared for reusing the existing USERS_MASTER employee master, NOT active
  # until the grantor is confirmed and a HANA deploy is approved. To activate,
  # uncomment this resource, add it to both `expense-management-srv.requires`
  # and `expense-management-db-deployer.requires`, set the real service-name,
  # and fill db/src/USERS_MASTER.hdb{synonym,grants}. See db/external/README.md.
  #
  # - name: bsx-org-apps-db
  #   type: org.cloudfoundry.existing-service
  #   parameters:
  #     service-name: <EXISTING_HDI_SERVICE_INSTANCE_FOR_hdi_bsx-org-apps-db>

  # ── XSUAA (Authentication & Authorization) ────────────────────────────────
  - name: expense-management-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: expense-management-${org}-${space}
        tenant-mode: dedicated

  # ── SMTP Mail Service (approver emails) ───────────────────────────────────
  # User-provided service holding SMTP credentials. Optional so a deploy
  # without it still succeeds (the mailer then no-ops until it's bound).
  - name: expense-management-mail
    type: org.cloudfoundry.existing-service
    optional: true
    parameters:
      service-name: expense-mail

  # ── HTML5 Application Repository (Host) ───────────────────────────────────
  # Stores the two freestyle apps. SAP Build Work Zone's "HTML5 Apps" content
  # channel auto-discovers app-host apps in this subaccount (grouped by their
  # manifest sap.cloud.service = com.bluestonex.expense), so they can be added to
  # the existing org Work Zone site. No launchpad/portal or standalone approuter
  # is deployed here — the apps run under Work Zone's managed approuter, which
  # resolves the 'expense-srv-api' destination (create it once, subaccount-level).
  - name: expense-management-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
