_schema-version: "3.1"
ID: expense-management
description: BluestoneX Expense Reimbursement System
version: 1.0.0

# ─────────────────────────────────────────────────────────────────────────────
# BUILD (runs before any module) — generates gen/srv + gen/db from the CAP model
# so the srv/db-deployer module paths resolve on a fresh clone (e.g. BAS).
# ─────────────────────────────────────────────────────────────────────────────
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

# ─────────────────────────────────────────────────────────────────────────────
# MODULES
# ─────────────────────────────────────────────────────────────────────────────
modules:

  # ── CAP Node.js Backend ────────────────────────────────────────────────────
  - name: expense-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      # 256M was too tight: the CAP runtime + HANA driver + draft activation +
      # nodemailer can briefly exceed it during submit, OOM-killing the container
      # mid-request (browser sees "communication failure") and forcing a slow
      # restart. 1G gives comfortable headroom.
      memory: 1024M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    properties:
      # Work Zone site base for the email "Review" CTA deep-links. MUST include the
      # /site/<siteId> path (the FLP shell resolving #Intent-action lives there;
      # a hash on the bare host 404s). Update if the site host/id changes.
      LAUNCHPAD_URL: https://bsx-tdd-qq8akzjn.launchpad.cfapps.eu10.hana.ondemand.com/site/MyBSX
    requires:
      - name: expense-management-db
      - name: expense-management-xsuaa
      # SMTP service for approver emails. Optional: if 'expense-mail' isn't
      # created, deploy still succeeds and the mailer safely no-ops.
      # Create it once with:
      #   cf cups expense-mail -p '{"host":"smtp.example.com","port":587,"user":"u","pass":"p","from":"noreply@bluestonex.com","secure":false}'
      - name: expense-management-mail
        parameters:
          optional: true
      # Cross-container read of the org USERS_MASTER (employee master). The runtime
      # user needs SELECT on it via the synonym in db/src. See db/external/README.md.
      - name: bsx-org-apps-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── HANA DB Deployer ───────────────────────────────────────────────────────
  - name: expense-management-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    properties:
      # Two HDI containers are bound (our own + the org grantor), so the HDI
      # deployer needs to be told which one to deploy INTO — otherwise it fails
      # with "More than one HDI service found ... TARGET_CONTAINER". This is OUR
      # container (the grantor is read-only, reached via the synonym/grants).
      TARGET_CONTAINER: expense-management-db
      # Let HDI undeploy container artifacts that no longer exist in the source.
      # Needed because EXP-EMPLOYEES.csv/.hdbtabledata were removed (Model B: the
      # EXP_EMPLOYEES table now deploys empty and is loaded manually in HANA).
      # Without this, the orphaned .hdbtabledata lingers in the container and its
      # make fails ("target table EXP_EMPLOYEES does not have a EMPLOYEENUMBER
      # column"). Only artifacts absent from source are undeployed.
      HDI_DEPLOY_OPTIONS: '{ "auto_undeploy": true }'
    requires:
      - name: expense-management-db
      # Grantor binding: the HDI deployer builds db/src/USERS_MASTER.hdbsynonym and
      # applies db/src/USERS_MASTER.hdbgrants (SELECT for #OO + runtime user)
      # against this cross-container service. See db/external/README.md.
      - name: bsx-org-apps-db

  # ── HTML5 App Content Deployer ─────────────────────────────────────────────
  - name: expense-management-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: expense-management-html5-host
        parameters:
          content-target: true
    build-parameters:
      # Stage into a fresh 'resources/' folder — NOT 'app/'. 'app/' is the source
      # dir (app/my-expenses, app/approval, .DS_Store), so zipping it produced an
      # invalid html5-apps-repo payload (CODE 1001). resources/ holds only the two
      # app zips, so data.zip contains exactly one zip per HTML5 app at its root.
      build-result: resources/
      requires:
        - name: expense-management-my-expenses
          artifacts: [ my-expenses.zip ]
          target-path: resources/
        - name: expense-management-approval
          artifacts: [ approval.zip ]
          target-path: resources/

  # ── Freestyle App: My Expenses (Employee) ──────────────────────────────────
  - name: expense-management-my-expenses
    type: html5
    path: app/my-expenses
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # ── Freestyle App: Approval (Approver + Admin, 3 tabs) ─────────────────────
  - name: expense-management-approval
    type: html5
    path: app/approval
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # ── Destination Content Deployer ───────────────────────────────────────────
  # Registers the app-host with SAP Build Work Zone so the two apps become
  # DISCOVERABLE (public) in Content Manager, and creates the backend destination
  # the Work Zone managed approuter uses to reach the CAP service (the apps'
  # xs-app.json routes /expense,/approval → 'expense-srv-api'). This replaces the
  # registration the old launchpad-deployer did — WITHOUT any portal/launchpad.
  - name: expense-management-destination-content
    type: com.sap.application.content
    requires:
      - name: expense-management-xsuaa
        parameters:
          service-key:
            name: expense-management-xsuaa-key
      - name: expense-management-html5-host
        parameters:
          service-key:
            name: expense-management-html5-host-key
      - name: srv-api
      - name: expense-management-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        # SUBACCOUNT scope (not instance): the BTP Cockpit "HTML5 Applications"
        # view and Work Zone Content Manager only discover app-hosts via
        # SUBACCOUNT-level destinations. An instance-level destination on the
        # destination service is invisible to them, so the apps never surface.
        subaccount:
          existing_destinations_policy: update
          destinations:
            # App-host registration → makes both apps discoverable in Cockpit + Work Zone
            - Name: expense-management-html5-repo-host
              ServiceInstanceName: expense-management-html5-host
              ServiceKeyName: expense-management-html5-host-key
              sap.cloud.service: com.bluestonex.expense
            # Backend for the managed approuter (matches app xs-app.json destination name)
            - Name: expense-srv-api
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: expense-management-xsuaa
              TokenServiceKeyName: expense-management-xsuaa-key
              URL: ~{srv-api/srv-url}
              HTML5.DynamicDestination: true
              HTML5.Timeout: 60000
              sap.cloud.service: com.bluestonex.expense

# ─────────────────────────────────────────────────────────────────────────────
# RESOURCES (BTP Service Instances)
# ─────────────────────────────────────────────────────────────────────────────
resources:

  # ── HANA HDI Container ────────────────────────────────────────────────────
  - name: expense-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ── External org-apps HDI container (classic USERS_MASTER) ─────────────────
  # Grantor service for the cross-container read of USERS_MASTER. The HDI deployer
  # uses this binding to apply db/src/USERS_MASTER.hdbgrants (SELECT for our #OO +
  # runtime user) and resolve db/src/USERS_MASTER.hdbsynonym at runtime.
  # ⚠ ACTION REQUIRED before deploy: replace <SERVICE_NAME> with the real service
  # instance for hdi_bsx-org-apps-db (must be able to grant SELECT on USERS_MASTER,
  # and be shared into this space). Deploy WILL FAIL until this exists.
  # See db/external/README.md.
  - name: bsx-org-apps-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: hdi_bsx-org-apps-db   # org container holding USERS_MASTER (schema DC573…)
    properties:
      the-service-name: ${service-name}   # exposes the instance name (owner's role-consumption pattern)

  # ── XSUAA (Authentication & Authorization) ────────────────────────────────
  - name: expense-management-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: expense-management-${org}-${space}
        tenant-mode: dedicated

  # ── SMTP Mail Service (approver emails) ───────────────────────────────────
  # User-provided service holding SMTP credentials. Optional so a deploy
  # without it still succeeds (the mailer then no-ops until it's bound).
  - name: expense-management-mail
    type: org.cloudfoundry.existing-service
    optional: true
    parameters:
      service-name: expense-mail

  # ── HTML5 Application Repository (Host) ───────────────────────────────────
  # Stores the two freestyle apps. They become discoverable (public) in Work
  # Zone's "HTML5 Apps" channel via the app-host registration destination created
  # by expense-management-destination-content. No launchpad/portal or standalone
  # approuter — the apps run under Work Zone's managed approuter.
  - name: expense-management-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ── Destination Service ───────────────────────────────────────────────────
  # Holds the design-time destinations created by expense-management-destination-
  # content: the app-host registration (Work Zone discovery) + the CAP backend.
  - name: expense-management-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
