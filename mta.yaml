_schema-version: "3.1"
ID: expense-management
description: BluestoneX Expense Reimbursement System
version: 1.0.0

# ─────────────────────────────────────────────────────────────────────────────
# BUILD (runs before any module) — generates gen/srv + gen/db from the CAP model
# so the srv/db-deployer module paths resolve on a fresh clone (e.g. BAS).
# ─────────────────────────────────────────────────────────────────────────────
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

# ─────────────────────────────────────────────────────────────────────────────
# MODULES
# ─────────────────────────────────────────────────────────────────────────────
modules:

  # ── CAP Node.js Backend ────────────────────────────────────────────────────
  - name: expense-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    requires:
      - name: expense-management-db
      - name: expense-management-xsuaa
      - name: expense-management-ans
      # SMTP service for approver emails. Optional: if 'expense-mail' isn't
      # created, deploy still succeeds and the mailer safely no-ops.
      # Create it once with:
      #   cf cups expense-mail -p '{"host":"smtp.example.com","port":587,"user":"u","pass":"p","from":"noreply@bluestonex.com","secure":false}'
      - name: expense-management-mail
        parameters:
          optional: true
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── HANA DB Deployer ───────────────────────────────────────────────────────
  - name: expense-management-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: expense-management-db

  # ── AppRouter ──────────────────────────────────────────────────────────────
  - name: expense-management-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 128M
      disk-quota: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: expense-srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: expense-management-xsuaa
      - name: expense-management-html5-runtime
      - name: expense-management-destination
    provides:
      - name: app-api
        properties:
          app-url: ${default-url}

  # ── HTML5 App Content Deployer ─────────────────────────────────────────────
  - name: expense-management-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: expense-management-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - name: expense-management-my-expenses
          artifacts: [ my-expenses.zip ]
          target-path: app/
        - name: expense-management-approval
          artifacts: [ approval.zip ]
          target-path: app/

  # ── Freestyle App: My Expenses (Employee) ──────────────────────────────────
  - name: expense-management-my-expenses
    type: html5
    path: app/my-expenses
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # ── Freestyle App: Approval (Approver + Admin, 3 tabs) ─────────────────────
  - name: expense-management-approval
    type: html5
    path: app/approval
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # ── Launchpad Content Deployer ─────────────────────────────────────────────
  - name: expense-management-launchpad-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: expense-management-launchpad
        parameters:
          content-target: true
          service-key:
            name: expense-management-launchpad-key
            config:
              content-endpoint: developer
      # Service keys the destinations below reference (were missing → deploy would fail).
      - name: expense-management-html5-host
        parameters:
          service-key:
            name: expense-management-html5-host-key
      - name: expense-management-xsuaa
        parameters:
          service-key:
            name: expense-management-xsuaa-key
      # Needed to resolve ~{srv-api/srv-url} (provided by the srv module).
      - name: srv-api
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            # Registers the HTML5 app-host with Work Zone via its service key +
            # sap.cloud.service (matches both apps' manifest.json).
            - Name: expense-management-html5-host
              ServiceInstanceName: expense-management-html5-host
              ServiceKeyName: expense-management-html5-host-key
              sap.cloud.service: com.bluestonex.expense
            - Name: expense-management-srv-api
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: expense-management-xsuaa
              TokenServiceKeyName: expense-management-xsuaa-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: com.bluestonex.expense

# ─────────────────────────────────────────────────────────────────────────────
# RESOURCES (BTP Service Instances)
# ─────────────────────────────────────────────────────────────────────────────
resources:

  # ── HANA HDI Container ────────────────────────────────────────────────────
  - name: expense-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ── External org-apps HDI container (classic USERS_MASTER) — STAGED ────────
  # Prepared for reusing the existing USERS_MASTER employee master, NOT active
  # until the grantor is confirmed and a HANA deploy is approved. To activate,
  # uncomment this resource, add it to both `expense-management-srv.requires`
  # and `expense-management-db-deployer.requires`, set the real service-name,
  # and fill db/src/USERS_MASTER.hdb{synonym,grants}. See db/external/README.md.
  #
  # - name: bsx-org-apps-db
  #   type: org.cloudfoundry.existing-service
  #   parameters:
  #     service-name: <EXISTING_HDI_SERVICE_INSTANCE_FOR_hdi_bsx-org-apps-db>

  # ── XSUAA (Authentication & Authorization) ────────────────────────────────
  - name: expense-management-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: expense-management-${org}-${space}
        tenant-mode: dedicated

  # ── Alert Notification Service (Email Notifications) ──────────────────────
  - name: expense-management-ans
    type: org.cloudfoundry.managed-service
    parameters:
      service: alert-notification
      service-plan: free

  # ── SMTP Mail Service (approver emails) ───────────────────────────────────
  # User-provided service holding SMTP credentials. Optional so a deploy
  # without it still succeeds (the mailer then no-ops until it's bound).
  - name: expense-management-mail
    type: org.cloudfoundry.existing-service
    optional: true
    parameters:
      service-name: expense-mail

  # ── HTML5 Application Repository (Host) ───────────────────────────────────
  - name: expense-management-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ── HTML5 Application Repository (Runtime) ────────────────────────────────
  - name: expense-management-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # ── Destination Service ───────────────────────────────────────────────────
  - name: expense-management-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ── SAP Launchpad Service ─────────────────────────────────────────────────
  - name: expense-management-launchpad
    type: org.cloudfoundry.managed-service
    parameters:
      service: portal
      service-plan: standard
